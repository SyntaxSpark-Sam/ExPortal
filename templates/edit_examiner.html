{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width:500px;">
    <h2 class="mb-4">Edit Examiner</h2>
        <div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ examiner.name }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ examiner.email }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Details</label>
                    <input type="text" name="phone" class="form-control" value="{{ examiner.phone or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" name="department" class="form-control" value="{{ examiner.department or '' }}">
                </div>
                <a href="{{ url_for('manage_examiners') }}" class="btn btn-secondary">Close</a>
                <button type="submit" class="btn btn-primary" style="margin-left:68%">Update</button>
            </form>
        </div>
</div>
{% endblock %}
