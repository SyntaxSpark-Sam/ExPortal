{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 500px;">
    <h3 class="text-center mb-4">Add Rubric for {{ exam.exam_name }}</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Criterion Name</label>
            <input type="text" name="criterion_name" class="form-control" maxlength="50" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Maximum Marks</label>
            <input type="number" name="max_marks" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Weightage (%)</label>
            <input type="number" name="weightage" class="form-control" min="1" max="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3" maxlength="100"></textarea>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('view_rubrics', exam_id=exam.id) }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Rubric</button>
        </div>
    </form>
</div>
{% endblock %}
