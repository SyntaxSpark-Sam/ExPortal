{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width:500px;">
    <h2 class="mb-4">Edit Student</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact Details</label>
            <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" value="{{ student.department or '' }}">
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('manage_students') }}" class="btn btn-secondary">Close</a>
            <button type="submit" class="btn btn-primary">Update</button>
        </div>
    </form>
</div>
{% endblock %}
