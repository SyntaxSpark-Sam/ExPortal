{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width:400px">
	<h2 style="text-align: center; margin-top:10px">Sign Up</h2>

	<form method="POST">
		<div>
			<div class="mb-3">
				<label for="name" class="form-label fw-bold">Your Name</label>
				<input required type="text" name="name" class="form-control" id="name">
			</div>
			<div class="mb-3">
				<label for="email" class="form-label fw-bold">Email Address</label>
				<input required type="email" name="email" class="form-control" id="email">
			</div>

			<div class="mb-3">
				<label for="inputPassword" class="form-label fw-bold">Password</label>
				<input required type="password" name="password" class="form-control" id="inputPassword">
			</div>

			<div class="mb-3 fw-bold">
				<label>SignUp As</label>
				<select style="margin-top:5px;" name="role" class="form-select" required>
					<option value="examiner" >Examiner</option>
					<option value="student">Student</option>
				</select>
			</div>
			<div class="mb-3">
				<label for="phone" class="form-label fw-bold">Phone No</label>
				<input type="text" name="phone" class="form-control" id="phone">
			</div>
			<div class="mb-3">
				<label for="department" class="form-label fw-bold">Department</label>
				<input type="text" name="department" class="form-control" id="department">
			</div>
			<span>Existing User? <a href="{{ url_for('login') }}" class="link-primary text-decoration-none fw-semibold">Login Here</a>
			<button type="submit" class="btn btn-primary" style="margin-left:100px">SignUp</button>
		</div>
	</form>
</div>
{% endblock %}
