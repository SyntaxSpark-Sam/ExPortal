{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 500px;">
    <h3 class="text-center mb-4">My Profile</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{ student.email }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" value="{{ student.department or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">New Password <small class="text-muted">(leave blank to keep current)</small></label>
            <input type="password" name="password" class="form-control" placeholder="Enter new password">
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-primary">Save Profile</button>
        </div>
    </form>
</div>
{% endblock %}
