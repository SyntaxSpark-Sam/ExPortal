{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 550px; margin-top:50px">
	<div class="card-body">
		<h3 class="text-center">Add Course</h3>
		<form method="POST" action="{{ url_for('add_course') }}">
			<div class="mb-3">
				<label class="form-label">Course Code</label>
				<input type="text" name="course_code" class="form-control" placeholder="e.g. BSCS2003" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Course Name</label>
				<input type="text" name="course_name" class="form-control" placeholder="e.g. MAD1" required>
			</div>

			<div class="mb-3">
				<label class="form-label">Course Description</label>
				<textarea name="description" class="form-control" placeholder="Description" rows="3"></textarea>
			</div>

			<div class="mb-3">
				<label class="form-label">Course Status</label>
				<select name="status" class="form-select" required>
					<option value="active" selected>Active</option>
					<option value="inactive">Inactive</option>
				</select>
			</div>

			<a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary" style="margin-top:10px;margin-left:5px">Cancel</a>
			<button type="submit" class="btn btn-primary" style="margin-top:10px;margin-left:320px">Save Course</button>
		</form>
	</div>
</div>
{% endblock %}
