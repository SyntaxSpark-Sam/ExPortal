{% extends 'base.html' %}
{% block content %}

<div class="container" style="max-width: 550px; margin-top:50px">
    <div class="card-body">
        <h3 class="text-center">Edit Course</h3>
        <form method="POST" action="{{ url_for('edit_course', course_id=course.id) }}">
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text" name="course_code" class="form-control" value="{{ course.course_code }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text" name="course_name" class="form-control" value="{{ course.course_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Description</label>
                <textarea name="description" class="form-control" rows="3">{{ course.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Status</label>
                <select name="status" class="form-select" required>
                    <option value="active" {% if course.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if course.status == 'inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>

            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary" style="margin-top:10px;margin-left:5px">Cancel</a>
            <button type="submit" class="btn btn-primary" style="margin-top:10px;margin-left:300px">Update Course</button>
        </form>
    </div>
</div>

{% endblock %}
