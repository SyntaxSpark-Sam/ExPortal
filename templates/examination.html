{% extends 'base.html' %}
{% block content %}

<div class="container mt-4 mb-5" style="max-width:600px;">
    <h3 class="text-center mb-4">Add Examination</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Select Course</label>
            <select name="course_id" class="form-select" required>
                <option value="">Select Course</option>
                {% for course in courses %}
                <option value="{{ course.id }}">
                    {{ course.course_name }} - {{ course.course_code }}
                </option>
                {% endfor %}
            </select>
        </div>

		<div class="mb-3">
			<label class="form-label">Assign Examiner</label>
			<select name="examiner_id" class="form-select">
				<option value="">Select Examiner</option>
				{% for examiner in examiners %}
				<option value="{{ examiner.id }}">
					{{ examiner.name }} ({{ examiner.department or 'N/A' }})
				</option>
				{% endfor %}
			</select>
		</div>

        <div class="mb-3">
            <label class="form-label">Examination Name</label>
            <input type="text" name="exam_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Examination Type</label>
            <input type="text" name="exam_type" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Duration (In Minutes)</label>
            <input type="number" name="duration" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Maximum Marks</label>
            <input type="number" name="max_marks" class="form-control" min="1" required>
        </div>


        <h5>Slot Creation Window</h5>
		<div class="row">
        	<div class="col mb-3">
            	<label class="form-label">Start Date</label>
				<input type="date" name="slot_creation_start_date" class="form-control" required>
        	</div>

			<div class="col mb-3">
            	<label class="form-label">End Date</label>
				<input type="date" name="slot_creation_end_date" class="form-control" required>
        	</div>
		</div>
		
        <h5>Student Booking Window</h5>
		<div class="row">
        	<div class="col mb-3">
        	    <label class="form-label">Start Date</label>
        	    <input type="date" name="slot_booking_start_date" class="form-control" required>
        	</div>

	        <div class="col mb-3">
	            <label class="form-label">End Date</label>
	            <input type="date" name="slot_booking_end_date" class="form-control" required>
	        </div>
		</div>
        <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Examination</button>
        </div>
    </form>
</div>
{% endblock %}
